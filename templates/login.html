<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in \u2014 ACTX Screening Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#2563EB; --blue-dark:#1D4ED8; --ink:#0F172A; --muted:#64748B; --paper:#F4F6FA; --line:#E4E8F0; --field:#F1F5F9; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, #0F172A 0%, #1E293B 45%, #2563EB 130%);
    font-family:'Inter',sans-serif; }
  .card{ background:#fff; border-radius:16px; padding:38px 36px; width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .badge{ width:40px; height:40px; border-radius:50%; background:var(--blue);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; margin-bottom:16px; }
  h1{ font-size:19px; margin:0 0 4px; }
  p.sub{ color:var(--muted); font-size:13px; margin:0 0 24px; }
  label{ display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:0.04em; margin-bottom:6px; }
  input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--field); font-size:14px; font-family:inherit; margin-bottom:16px; }
  input:focus{ outline:2px solid var(--blue); outline-offset:1px; background:#fff; }
  button{ width:100%; padding:11px; background:var(--blue); color:#fff; border:none; border-radius:8px;
    font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  button:hover{ background:var(--blue-dark); }
  .flash{ background:#FEF2F2; color:#B91C1C; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px; }
  .foot{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:18px; }
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="badge">OS</div>
    <h1>ACTX Screening Platform</h1>
    <p class="sub">Sanctions, PEP &amp; terrorism list screening</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}{% endif %}
    {% endwith %}
    <label>Username</label>
    <input type="text" name="username" autofocus required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Sign in</button>
    <div class="foot">Screening data powered by OpenSanctions</div>
  </form>
</body>
</html>
