services:
  - type: web
    name: actx-screening
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENSANCTIONS_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false