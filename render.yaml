services:
  - type: web
    name: actx-screening
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENSANCTIONS_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: actx-screening-db
          property: connectionString

databases:
  - name: actx-screening-db
    plan: starter
